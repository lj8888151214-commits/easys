spring.application.name=easys
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/neoship?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Gmail SMTP
# 실제 값은 반드시 환경변수(MAIL_USERNAME / MAIL_PASSWORD)로 주입할 것.
# MAIL_PASSWORD는 Gmail 앱 비밀번호를 사용한다.
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:changeme@example.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Toss Payments
# 실제 값은 반드시 환경변수(TOSS_CLIENT_KEY / TOSS_SECRET_KEY)로 주입할 것.
# 아래 client-key 기본값은 토스에서 공개적으로 제공하는 테스트용 키이며 프로덕션에는 사용 불가.
# ===============================
toss.client-key=${TOSS_CLIENT_KEY:test_ck_ALnQvDd2VJq1nJeMDynP3Mj7X41m}
toss.secret-key=${TOSS_SECRET_KEY}

# ===============================
# OAuth2 - Google 소셜 로그인
# 발급 방법: Google Cloud Console > API 및 서비스 > 사용자 인증 정보
#   승인된 리디렉션 URI: http://localhost:8080/login/oauth2/code/google
# 실제 값은 반드시 환경변수(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)로 주입할 것.
# 아래 기본값은 발급 전에도 서버가 뜨도록 하기 위한 더미 값이며 로그인에는 사용할 수 없다.
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=email

# 구글이 콜백 후 브라우저를 실제로 어디로 되돌려보낼지 (프론트엔드 dev 서버 주소)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ===============================
# 카카오톡 알림 (관리자 전용 "나에게 보내기")
# 발급 방법: Kakao Developers > 내 애플리케이션 > 카카오 로그인 활성화 후
#   동의항목에서 "카카오톡 메시지 전송(talk_message)" 사용 설정
#   승인된 리디렉션 URI: http://localhost:8080/admin/kakao-notify/callback
# 실제 값은 반드시 환경변수(KAKAO_REST_API_KEY)로 주입할 것.
# ===============================
kakao.rest-api-key=${KAKAO_REST_API_KEY:changeme-kakao-rest-api-key}
# "카카오 로그인 > 보안"에서 Client Secret을 켠 경우에만 설정하면 된다. 꺼져 있으면 비워둘 것.
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/admin/kakao-notify/callback}

# ===============================
# Admin bootstrap
# ===============================
app.admin.bootstrap-email=yeunjun37@gmail.com