# ===============================
# OAuth2 - Google 소셜 로그인
# 발급 방법: Google Cloud Console > API 및 서비스 > 사용자 인증 정보
#   승인된 리디렉션 URI: http://localhost:8080/login/oauth2/code/google
# 실제 값은 반드시 환경변수(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)로 주입할 것.
# 아래 기본값은 발급 전에도 서버가 뜨도록 하기 위한 더미 값이며 로그인에는 사용할 수 없다.
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=email

# 구글이 콜백 후 브라우저를 실제로 어디로 되돌려보낼지 (프론트엔드 dev 서버 주소)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ===============================
# Admin bootstrap
# ===============================
app.admin.bootstrap-email=yeunjun37@gmail.com

# ===============================
# Redis (1단계: 연결만 - 아직 대화 저장 용도로는 안 씀)
# 로컬 개발 환경 기준 기본값(localhost:6379)이며, 필요하면 환경변수로 덮어쓸 수 있다.
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===============================
# AI 챗봇 대화 세션 (2단계 - Redis에 저장할 대화 맥락 설정)
# max-turns: 최근 몇 턴(질문+답변 1쌍)까지 기억할지
# ttl-minutes: 마지막 대화로부터 몇 분 동안 기억할지
# ===============================
chat.session.max-turns=${CHAT_SESSION_MAX_TURNS:10}
chat.session.ttl-minutes=${CHAT_SESSION_TTL_MINUTES:30}

# ===============================
# 로컬 LLM (Ollama/Qwen2.5 3B)
# temperature: 낮을수록 답변이 더 결정적이고 참고 지식에서 덜 벗어난다.
# ===============================
llm.base-url=${LLM_BASE_URL:http://localhost:11434}
llm.model=${LLM_MODEL:qwen2.5:3b}
llm.temperature=${LLM_TEMPERATURE:0.4}

# ===============================
# 20단계: 비로그인 사용자 AI 챗봇 무료 체험
# free-limit: 몇 번까지 무료로 물어볼 수 있는지 (그 이후엔 회원가입 유도)
# reset-hours: 그 횟수가 몇 시간마다 다시 채워지는지
# ===============================
ai.guest.free-limit=${AI_GUEST_FREE_LIMIT:3}
ai.guest.reset-hours=${AI_GUEST_RESET_HOURS:24}
