spring.application.name=easys
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/neoship?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
# 로컬 환경변수 DB_PASSWORD가 없으면 기존 로컬 개발 기본값(1234)을 그대로 사용한다.
spring.datasource.password=${DB_PASSWORD:1234}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
# 애플리케이션 시작 시 Entity 기준으로 테이블 생성/수정
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# SQL을 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Gmail SMTP
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# 실제 Gmail 주소/앱 비밀번호는 반드시 로컬 환경변수(GMAIL_USERNAME / GMAIL_APP_PASSWORD)로
# 설정한다. 이 파일에는 실제 값을 직접 입력하지 않는다(GitHub에 올라가는 파일이므로).
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Toss Payments (테스트 결제)
# ===============================
# 실제 서비스에서는 반드시 환경변수(TOSS_CLIENT_KEY / TOSS_SECRET_KEY)로 설정한다.
# 아래 기본값은 토스페이먼츠가 공식 문서/샘플에서 공개적으로 배포하는 테스트 키이며,
# 별도 설정이 없어도 테스트 결제가 동작하도록 하기 위한 값이다.
toss.client-key=${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
toss.secret-key=${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}