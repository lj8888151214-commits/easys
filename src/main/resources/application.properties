spring.application.name=easys
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/neoship?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Gmail SMTP
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Toss Payments
# 실제 키는 반드시 환경변수로 주입 (TOSS_CLIENT_KEY / TOSS_SECRET_KEY)
# ===============================
toss.client-key=${TOSS_CLIENT_KEY}
toss.secret-key=${TOSS_SECRET_KEY}

# ===============================
# OAuth2 - Google 소셜 로그인
# 발급 방법: Google Cloud Console > API 및 서비스 > 사용자 인증 정보
#   승인된 리디렉션 URI: http://localhost:8080/login/oauth2/code/google
# 실제 값은 반드시 환경변수(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)로 주입할 것.
# 아래 기본값은 발급 전에도 서버가 뜨도록 하기 위한 더미 값이며 로그인에는 사용할 수 없다.
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=email

# 구글이 콜백 후 브라우저를 실제로 어디로 되돌려보낼지 (프론트엔드 dev 서버 주소)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ===============================
# Admin bootstrap
# ===============================
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL}

# ===============================
# Redis (1단계: 연결만 - 아직 대화 저장 용도로는 안 씀)
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===============================
# AI 챗봇 대화 세션 (2단계)
# ===============================
chat.session.max-turns=${CHAT_SESSION_MAX_TURNS:10}
chat.session.ttl-minutes=${CHAT_SESSION_TTL_MINUTES:30}

# ===============================
# 로컬 LLM (Ollama/Qwen2.5 3B)
# ===============================
llm.base-url=${LLM_BASE_URL:http://localhost:11434}
llm.model=${LLM_MODEL:qwen2.5:3b}
llm.temperature=${LLM_TEMPERATURE:0.4}

# ===============================
# 20단계: 비로그인 사용자 AI 챗봇 무료 체험
# ===============================
ai.guest.free-limit=${AI_GUEST_FREE_LIMIT:3}
ai.guest.reset-hours=${AI_GUEST_RESET_HOURS:24}
