spring.application.name=easys
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/neoship?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
# 로컬 환경변수 DB_PASSWORD가 없으면 기존 로컬 개발 기본값(1234)을 그대로 사용한다.
spring.datasource.password=${DB_PASSWORD:1234}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
# 애플리케이션 시작 시 Entity 기준으로 테이블 생성/수정
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# SQL을 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Gmail SMTP
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

