spring.application.name=easys
server.port=8080

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/neoship?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
# 로컬 환경변수 DB_PASSWORD가 없으면 기존 로컬 개발 기본값(1234)을 그대로 사용한다.
spring.datasource.password=${DB_PASSWORD:1234}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
# 애플리케이션 시작 시 Entity 기준으로 테이블 생성/수정
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# SQL을 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Gmail SMTP
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# 실제 Gmail 주소/앱 비밀번호는 반드시 로컬 환경변수(GMAIL_USERNAME / GMAIL_APP_PASSWORD)로
# 설정한다. 이 파일에는 실제 값을 직접 입력하지 않는다(GitHub에 올라가는 파일이므로).
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Toss Payments (API 개별 연동 키 - 테스트)
# ===============================
# Client Key는 브라우저에도 노출되는 공개 성격의 값이라 기본값을 둬도 안전하지만,
# Secret Key는 절대 노출되면 안 되므로 이 파일에는 기본값을 두지 않는다.
# 로컬에서 결제 승인(confirm) API를 테스트하려면 반드시 로컬 환경변수
# TOSS_SECRET_KEY를 직접 설정해야 한다 (미설정 시 결제 승인 단계에서 실패한다).
toss.client-key=${TOSS_CLIENT_KEY:test_ck_ALnQvDd2VJq1nJeMDynP3Mj7X41m}
toss.secret-key=${TOSS_SECRET_KEY}