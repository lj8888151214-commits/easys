# ===============================
# OAuth2 - Google 소셜 로그인
# 발급 방법: Google Cloud Console > API 및 서비스 > 사용자 인증 정보
#   승인된 리디렉션 URI: http://localhost:8080/login/oauth2/code/google
# 실제 값은 반드시 환경변수(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)로 주입할 것.
# 아래 기본값은 발급 전에도 서버가 뜨도록 하기 위한 더미 값이며 로그인에는 사용할 수 없다.
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=email

