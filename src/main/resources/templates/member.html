<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>NeoShip 회원가입</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            width: 400px;

            margin: 70px auto;

            color: #222;
        }


        h1 {

            text-align: center;

            margin-bottom: 40px;
        }


        .input-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 5px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;
        }


        input:focus {

            outline: none;

            border-color: #333;
        }


        input:disabled {

            background-color: #eeeeee;

            color: #777;
        }


        input:read-only {

            background-color: #eeeeee;
        }


        button {

            padding: 10px 15px;

            margin-top: 5px;

            cursor: pointer;

            border: 1px solid #ccc;

            background: white;

            border-radius: 5px;

            font-size: 14px;
        }


        button:hover {

            background: #f3f3f3;
        }


        button:disabled {

            cursor: not-allowed;

            opacity: 0.6;
        }


        .email-area {

            display: flex;

            gap: 5px;
        }


        .email-area input {

            flex: 1;
        }


        .email-area button {

        width: 120px;

    min-width: 120px;

    flex-shrink: 0;

    white-space: nowrap;

    padding: 10px 8px;

    font-size: 14px;

    display: flex;

    align-items: center;

    justify-content: center;
        }


        /* 비밀번호 안내 */

        .password-guide {

            margin-top: 7px;

            font-size: 13px;

            color: #777;

            line-height: 1.5;
        }


        .password-guide.valid {

            color: green;
        }


        .password-guide.invalid {

            color: #d9534f;
        }


        /* 인증 완료 메시지 */

        .verified {

            margin-top: 7px;

            font-size: 13px;

            color: green;

            font-weight: bold;
        }


        /* 결과창 */

        #result {

            margin-top: 20px;

            padding: 15px;

            background: #f3f3f3;

            border-radius: 5px;

            white-space: pre-wrap;

            line-height: 1.5;

            min-height: 50px;
        }


        /* 회원가입 버튼 */

        .signup-button {

            width: 100%;

            margin-top: 10px;

            padding: 13px;

            background: #222;

            color: white;

            border: none;

            font-size: 16px;
        }


        .signup-button:hover {

            background: #444;
        }


    </style>

</head>


<body>


<h1>
    NeoShip 회원가입
</h1>



<form id="memberForm">


    <!-- ==========================================
         생년월일
         ========================================== -->

    <div class="input-group">

        <label for="birthday">
            생년월일
        </label>


        <input
                type="text"
                id="birthday"
                maxlength="6"
                placeholder="예: 000823"
                required
        >

    </div>



    <!-- ==========================================
         이메일
         ========================================== -->

    <div class="input-group">

        <label for="email">
            이메일
        </label>


        <div class="email-area">

            <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
            >


            <button
                    type="button"
                    id="sendEmailButton"
                    onclick="sendEmail()"
            >
                인증번호 받기
            </button>

        </div>

    </div>



    <!-- ==========================================
         인증번호
         ========================================== -->

    <div class="input-group">

        <label for="verificationCode">
            인증번호
        </label>


        <div class="email-area">

            <input
                    type="text"
                    id="verificationCode"
                    maxlength="6"
                    placeholder="6자리 인증번호"
            >


            <button
                    type="button"
                    id="verifyEmailButton"
                    onclick="verifyEmail()"
            >
                인증하기
            </button>

        </div>


        <!-- 인증 완료 표시 -->

        <div
                id="verifiedMessage"
                class="verified"
                style="display: none;"
        >
            ✓ 이메일 인증 완료
        </div>

    </div>



    <!-- ==========================================
         비밀번호
         ========================================== -->

    <div class="input-group">

        <label for="password">
            비밀번호
        </label>


        <input
                type="password"
                id="password"
                placeholder="비밀번호"
                required
        >


        <div
                id="passwordGuide"
                class="password-guide"
        >

            영어 + 숫자 + 특수문자를 포함한
            8자 이상이어야 합니다.

        </div>

    </div>



    <!-- ==========================================
         비밀번호 확인
         ========================================== -->

    <div class="input-group">

        <label for="passwordConfirm">
            비밀번호 확인
        </label>


        <input
                type="password"
                id="passwordConfirm"
                placeholder="비밀번호 다시 입력"
                required
        >

    </div>



    <!-- ==========================================
         닉네임
         ========================================== -->

    <div class="input-group">

        <label for="nickname">
            닉네임
        </label>


        <input
                type="text"
                id="nickname"
                placeholder="닉네임"
                required
        >

    </div>



    <!-- ==========================================
         회원가입 버튼
         ========================================== -->

    <button
            type="submit"
            class="signup-button"
    >
        회원가입
    </button>


</form>



<!-- ==========================================
     결과 표시
     ========================================== -->

<div id="result">


</div>



<script>


    // ============================================================
    // 이메일 인증 완료 여부
    //
    // 처음에는 false
    //
    // 인증번호를 정확하게 인증해야 true가 됨
    // ============================================================

    let emailVerified = false;



    // ============================================================
    // 인증된 이메일
    //
    // 인증 성공 당시 이메일을 저장
    //
    // 다른 이메일로 바꾸면 다시 인증해야 함
    // ============================================================

    let verifiedEmail = "";



    // ============================================================
    // 비밀번호 정규식
    //
    // 영어 1개 이상
    // 숫자 1개 이상
    // 특수문자 1개 이상
    // 전체 8자 이상
    // ============================================================

    const passwordPattern =
        /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;



    // ============================================================
    // 결과 출력 함수
    // ============================================================

    function showResult(message) {

        document
            .getElementById("result")
            .textContent = message;

    }



    // ============================================================
    // 이메일 값이 변경되면
    //
    // 기존 인증 상태를 무효화
    //
    // 예:
    //
    // abc@gmail.com 인증 완료
    // ↓
    // 다른@gmail.com으로 변경
    // ↓
    // 다시 인증해야 함
    // ============================================================

    document
        .getElementById("email")
        .addEventListener(
            "input",
            function () {

                if (
                    emailVerified &&
                    this.value.trim() !== verifiedEmail
                ) {

                    emailVerified = false;

                    verifiedEmail = "";

                    document
                        .getElementById(
                            "verifiedMessage"
                        )
                        .style.display = "none";


                    document
                        .getElementById(
                            "verificationCode"
                        )
                        .disabled = false;


                    document
                        .getElementById(
                            "verifyEmailButton"
                        )
                        .disabled = false;


                    document
                        .getElementById(
                            "verifyEmailButton"
                        )
                        .textContent = "인증하기";

                }

            }
        );



    // ============================================================
    // 이메일 인증번호 보내기
    // ============================================================

    async function sendEmail() {


        const email =
            document
                .getElementById("email")
                .value
                .trim();



        // 이메일 입력 확인

        if (!email) {

            alert(
                "이메일을 입력해주세요."
            );

            return;
        }



        // 이메일 형식 확인

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

            alert(
                "올바른 이메일 형식을 입력해주세요."
            );

            return;
        }



        const button =
            document.getElementById(
                "sendEmailButton"
            );



        try {


            // 버튼 잠시 비활성화

            button.disabled = true;

            button.textContent =
                "전송 중...";



            const response =
                await fetch(
                    "/email/send",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email

                        })

                    }
                );



            const result =
                await response.text();



            showResult(result);



            // 이메일 전송 실패

            if (!response.ok) {

                return;
            }



            // 새로운 인증번호를 받았으므로
            // 인증 상태 초기화

            emailVerified = false;

            verifiedEmail = "";



            document
                .getElementById(
                    "verifiedMessage"
                )
                .style.display = "none";



            document
                .getElementById(
                    "verificationCode"
                )
                .disabled = false;



            document
                .getElementById(
                    "verifyEmailButton"
                )
                .disabled = false;



            document
                .getElementById(
                    "verifyEmailButton"
                )
                .textContent =
                "인증하기";


        } catch (error) {


            console.error(error);


            showResult(
                "이메일 전송 중 오류가 발생했습니다."
            );


        } finally {


            button.disabled = false;

            button.textContent =
                "인증번호 받기";

        }

    }



    // ============================================================
    // 이메일 인증번호 확인
    // ============================================================

    async function verifyEmail() {


        const email =
            document
                .getElementById("email")
                .value
                .trim();



        const verificationCode =
            document
                .getElementById(
                    "verificationCode"
                )
                .value
                .trim();



        // 이메일 확인

        if (!email) {

            alert(
                "이메일을 입력해주세요."
            );

            return;
        }



        // 인증번호 확인

        if (!verificationCode) {

            alert(
                "인증번호를 입력해주세요."
            );

            return;
        }



        // 6자리 숫자인지 확인

        if (
            !/^\d{6}$/.test(
                verificationCode
            )
        ) {

            alert(
                "인증번호는 6자리 숫자입니다."
            );

            return;
        }



        const button =
            document.getElementById(
                "verifyEmailButton"
            );



        try {


            button.disabled = true;

            button.textContent =
                "확인 중...";



            const response =
                await fetch(
                    "/email/verify",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email,

                            verificationCode:
                                verificationCode

                        })

                    }
                );



            const result =
                await response.text();



            showResult(result);



            // ====================================================
            // ★★★ 인증 성공 ★★★
            // ====================================================

            if (response.ok) {


                // 인증 상태 true

                emailVerified = true;


                // 인증된 이메일 저장

                verifiedEmail = email;



                // 이메일 입력 잠금

                document
                    .getElementById("email")
                    .readOnly = true;



                // 인증번호 입력 잠금

                document
                    .getElementById(
                        "verificationCode"
                    )
                    .disabled = true;



                // 인증 버튼 잠금

                button.disabled = true;

                button.textContent =
                    "인증 완료";



                // 인증 완료 표시

                document
                    .getElementById(
                        "verifiedMessage"
                    )
                    .style.display = "block";



                showResult(
                    "이메일 인증이 완료되었습니다."
                );

            }


        } catch (error) {


            console.error(error);


            showResult(
                "이메일 인증 중 오류가 발생했습니다."
            );


        } finally {


            // 인증 성공이 아니면
            // 버튼 다시 활성화

            if (!emailVerified) {

                button.disabled = false;

                button.textContent =
                    "인증하기";

            }

        }

    }



    // ============================================================
    // 비밀번호 실시간 검사
    // ============================================================

    document
        .getElementById("password")
        .addEventListener(
            "input",
            function () {


                const password =
                    this.value;


                const guide =
                    document.getElementById(
                        "passwordGuide"
                    );



                // 아무것도 입력하지 않은 경우

                if (!password) {

                    guide.textContent =
                        "영어 + 숫자 + 특수문자를 포함한 8자 이상이어야 합니다.";

                    guide.className =
                        "password-guide";

                    return;
                }



                // 조건 만족

                if (
                    passwordPattern.test(
                        password
                    )
                ) {

                    guide.textContent =
                        "✓ 사용 가능한 비밀번호입니다.";

                    guide.className =
                        "password-guide valid";

                }


                // 조건 불만족

                else {

                    guide.textContent =
                        "✗ 영어 + 숫자 + 특수문자를 포함한 8자 이상이어야 합니다.";

                    guide.className =
                        "password-guide invalid";

                }

            }
        );



    // ============================================================
    // 회원가입
    // ============================================================

    document
        .getElementById("memberForm")
        .addEventListener(
            "submit",
            async function (event) {


                // 기본 submit 방지

                event.preventDefault();



                // ==================================================
                // ★★★★★ 가장 중요 ★★★★★
                //
                // 이메일 인증을 하지 않았다면
                // 회원가입 요청 자체를 보내지 않음
                // ==================================================

                if (!emailVerified) {


                    showResult(
                        "이메일 인증을 먼저 완료해주세요."
                    );


                    alert(
                        "이메일 인증을 먼저 완료해주세요."
                    );


                    return;

                }



                // ==================================================
                // 인증된 이메일과 현재 이메일 비교
                // ==================================================

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();



                if (
                    email !== verifiedEmail
                ) {


                    emailVerified = false;


                    showResult(
                        "이메일이 변경되었습니다. 다시 인증해주세요."
                    );


                    alert(
                        "이메일이 변경되었습니다. 다시 인증해주세요."
                    );


                    return;

                }



                // ==================================================
                // 입력값 가져오기
                // ==================================================

                const birthday =
                    document
                        .getElementById(
                            "birthday"
                        )
                        .value
                        .trim();



                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;



                const passwordConfirm =
                    document
                        .getElementById(
                            "passwordConfirm"
                        )
                        .value;



                const nickname =
                    document
                        .getElementById(
                            "nickname"
                        )
                        .value
                        .trim();



                // ==================================================
                // 비밀번호 조건 확인
                // ==================================================

                if (
                    !passwordPattern.test(
                        password
                    )
                ) {


                    showResult(
                        "비밀번호는 영어 + 숫자 + 특수문자를 포함하여 8자 이상이어야 합니다."
                    );


                    alert(
                        "비밀번호 조건을 확인해주세요."
                    );


                    return;

                }



                // ==================================================
                // 비밀번호 확인
                // ==================================================

                if (
                    password !==
                    passwordConfirm
                ) {


                    showResult(
                        "비밀번호가 일치하지 않습니다."
                    );


                    alert(
                        "비밀번호가 일치하지 않습니다."
                    );


                    return;

                }



                // ==================================================
                // 닉네임 확인
                // ==================================================

                if (!nickname) {


                    showResult(
                        "닉네임을 입력해주세요."
                    );


                    return;

                }



                // ==================================================
                // 회원가입 요청
                // ==================================================

                try {


                    const response =
                        await fetch(
                            "/member",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        birthday:
                                            birthday,

                                        email:
                                            email,

                                        password:
                                            password,

                                        passwordConfirm:
                                            passwordConfirm,

                                        nickname:
                                            nickname

                                    })

                            }
                        );



                    const result =
                        await response.text();



                    showResult(result);



                    // ==================================================
                    // 회원가입 성공
                    // ==================================================

                    if (response.ok) {


                        alert(
                            "회원가입이 완료되었습니다!"
                        );


                        location.href =
                            "/login.html";

                    }


                } catch (error) {


                    console.error(error);


                    showResult(
                        "회원가입 중 오류가 발생했습니다."
                    );

                }

            }
        );


</script>


</body>

</html>
