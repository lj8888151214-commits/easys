<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeoShip - 마이페이지</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                    Arial,
                    sans-serif;

            background: #f5f7fb;

            color: #222;
        }


        .container {

            width: 500px;

            margin: 60px auto;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                    0 10px 30px
                    rgba(0, 0, 0, 0.08);
        }


        h1 {

            text-align: center;

            margin-bottom: 35px;
        }


        .profile-image {

            width: 90px;

            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #eeeeee;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;
        }


        /* =================================================
           회원정보 영역
           ================================================= */

        .info {

            margin-bottom: 20px;
        }


        .label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            color: #888;
        }


        .value {

            display: block;

            padding: 13px;

            background: #f7f7f7;

            border-radius: 8px;

            font-size: 15px;
        }


        /* =================================================
           수정 폼
           ================================================= */

        .edit-form {

            display: none;

            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #eee;
        }


        .edit-form h2 {

            font-size: 20px;

            margin-bottom: 25px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            font-family: inherit;
        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #222;
        }


        .form-group textarea {

            min-height: 100px;

            resize: vertical;
        }


        /* =================================================
           버튼
           ================================================= */

        .button-area {

            margin-top: 30px;
        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;
        }


        .edit-button {

            background: #222;

            color: white;
        }


        .edit-button:hover {

            background: #444;
        }


        .save-button {

            background: #222;

            color: white;
        }


        .save-button:hover {

            background: #444;
        }


        .cancel-button {

            background: #eee;

            color: #333;
        }


        .password-button {

            background: #555;

            color: white;
        }


        .logout-button {

            background: #eee;

            color: #333;
        }


        #result {

            margin-top: 20px;

            text-align: center;

            font-size: 14px;
        }


        /* =================================================
           모바일
           ================================================= */

        @media (max-width: 600px) {

            .container {

                width: calc(100% - 30px);

                margin: 30px auto;

                padding: 25px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         제목
         ================================================= -->

    <h1>
        MY PAGE
    </h1>


    <!-- 프로필 이미지 -->

    <div class="profile-image">
        👤
    </div>


    <!-- =================================================
         현재 회원정보
         ================================================= -->


    <!-- 닉네임 -->

    <div class="info">

        <span class="label">
            닉네임
        </span>

        <span
                id="nickname"
                class="value">

            불러오는 중...

        </span>

    </div>


    <!-- 이메일 -->

    <div class="info">

        <span class="label">
            이메일
        </span>

        <span
                id="email"
                class="value">

            불러오는 중...

        </span>

    </div>


    <!-- 생년월일 -->

    <div class="info">

        <span class="label">
            생년월일
        </span>

        <span
                id="birthday"
                class="value">

            불러오는 중...

        </span>

    </div>


    <!-- 자기소개 -->

    <div class="info">

        <span class="label">
            자기소개
        </span>

        <span
                id="bio"
                class="value">

            불러오는 중...

        </span>

    </div>



    <!-- =================================================
         기본 버튼
         ================================================= -->

    <div class="button-area">


        <!-- 회원정보 수정 -->

        <button
                type="button"
                class="edit-button"
                onclick="showEditForm()">

            회원정보 수정

        </button>


        <!-- 비밀번호 변경 -->

        <button
                type="button"
                class="password-button"
                onclick="changePassword()">

            비밀번호 변경

        </button>


        <!-- 로그아웃 -->

        <button
                type="button"
                class="logout-button"
                onclick="logout()">

            로그아웃

        </button>


    </div>



    <!-- =================================================
         회원정보 수정 폼

         처음에는 display:none

         회원정보 수정 버튼을 누르면 나타난다.
         ================================================= -->

    <div
            id="editForm"
            class="edit-form">


        <h2>
            회원정보 수정
        </h2>


        <!-- 닉네임 -->

        <div class="form-group">

            <label>
                닉네임
            </label>

            <input
                    type="text"
                    id="editNickname"
                    placeholder="닉네임을 입력해주세요."
            >

        </div>


        <!-- 생년월일 -->

        <div class="form-group">

            <label>
                생년월일
            </label>

            <input
                    type="text"
                    id="editBirthday"
                    maxlength="6"
                    placeholder="예: 000823"
            >

        </div>


        <!-- 자기소개 -->

        <div class="form-group">

            <label>
                자기소개
            </label>

            <textarea
                    id="editBio"
                    placeholder="자기소개를 입력해주세요."
            ></textarea>

        </div>


        <!-- 저장 -->

        <button
                type="button"
                class="save-button"
                onclick="updateProfile()">

            저장하기

        </button>


        <!-- 취소 -->

        <button
                type="button"
                class="cancel-button"
                onclick="hideEditForm()">

            취소

        </button>


    </div>


    <!-- 결과 메시지 -->

    <div id="result"></div>


</div>



<script>


    // =====================================================
    // 페이지가 열리면 회원정보 가져오기
    // =====================================================

    document.addEventListener(
            "DOMContentLoaded",
            loadMyInfo
    );


    // =====================================================
    // 현재 회원정보 조회
    // =====================================================

    async function loadMyInfo() {

        try {


            const response =
                    await fetch("/member/me");


            /*
             * 로그인하지 않은 경우
             */

            if (!response.ok) {

                throw new Error(
                        "로그인이 필요합니다."
                );
            }


            /*
             * JSON 데이터 가져오기
             */

            const member =
                    await response.json();


            /*
             * 현재 회원정보 화면에 표시
             */

            document
                    .getElementById("nickname")
                    .textContent =
                    member.nickname;


            document
                    .getElementById("email")
                    .textContent =
                    member.email;


            document
                    .getElementById("birthday")
                    .textContent =
                    member.birthday || "-";


            document
                    .getElementById("bio")
                    .textContent =
                    member.bio ||
                    "자기소개가 없습니다.";


        } catch (error) {


            document
                    .getElementById("result")
                    .textContent =
                    error.message;

        }

    }



    // =====================================================
    // 회원정보 수정 폼 열기
    // =====================================================

    function showEditForm() {


        /*
         * 현재 화면에 있는 회원정보를
         * 수정 입력창에 넣는다.
         */

        const nickname =
                document
                        .getElementById("nickname")
                        .textContent;


        const birthday =
                document
                        .getElementById("birthday")
                        .textContent;


        const bio =
                document
                        .getElementById("bio")
                        .textContent;


        /*
         * 닉네임
         */

        document
                .getElementById("editNickname")
                .value =
                nickname;


        /*
         * 생년월일
         */

        document
                .getElementById("editBirthday")
                .value =
                birthday === "-"
                        ? ""
                        : birthday;


        /*
         * 자기소개
         */

        document
                .getElementById("editBio")
                .value =
                bio ===
                "자기소개가 없습니다."
                        ? ""
                        : bio;


        /*
         * 수정 폼 보여주기
         */

        document
                .getElementById("editForm")
                .style.display =
                "block";


        /*
         * 수정 폼 위치로 스크롤
         */

        document
                .getElementById("editForm")
                .scrollIntoView({
                    behavior: "smooth"
                });

    }



    // =====================================================
    // 회원정보 수정 폼 닫기
    // =====================================================

    function hideEditForm() {


        document
                .getElementById("editForm")
                .style.display =
                "none";

    }



    // =====================================================
    // 회원정보 저장
    // =====================================================

    async function updateProfile() {


        /*
         * 입력창에서 데이터 가져오기
         */

        const nickname =
                document
                        .getElementById("editNickname")
                        .value
                        .trim();


        const birthday =
                document
                        .getElementById("editBirthday")
                        .value
                        .trim();


        const bio =
                document
                        .getElementById("editBio")
                        .value
                        .trim();


        /*
         * 닉네임 필수
         */

        if (!nickname) {

            alert(
                    "닉네임을 입력해주세요."
            );

            return;
        }


        /*
         * 서버로 수정 요청
         */

        try {


            const response =
                    await fetch(
                            "/member/me",
                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                            "application/json"
                                },

                                body:
                                        JSON.stringify({

                                            nickname:
                                                    nickname,

                                            birthday:
                                                    birthday,

                                            bio:
                                                    bio
                                        })
                            }
                    );


            /*
             * 성공
             */

            if (response.ok) {


                const member =
                        await response.json();


                /*
                 * 화면에 수정된 정보 표시
                 */

                document
                        .getElementById("nickname")
                        .textContent =
                        member.nickname;


                document
                        .getElementById("birthday")
                        .textContent =
                        member.birthday || "-";


                document
                        .getElementById("bio")
                        .textContent =
                        member.bio ||
                        "자기소개가 없습니다.";


                /*
                 * 수정창 닫기
                 */

                hideEditForm();


                /*
                 * 성공 메시지
                 */

                document
                        .getElementById("result")
                        .textContent =
                        "회원정보가 수정되었습니다.";


            } else {


                /*
                 * 서버에서 전달한 오류 메시지
                 */

                const message =
                        await response.text();


                document
                        .getElementById("result")
                        .textContent =
                        message;

            }


        } catch (error) {


            document
                    .getElementById("result")
                    .textContent =
                    "회원정보 수정 중 오류가 발생했습니다.";

        }

    }



    // =====================================================
    // 비밀번호 변경
    // =====================================================

    async function changePassword() {


        const currentPassword =
                prompt(
                        "현재 비밀번호를 입력해주세요."
                );


        if (currentPassword === null) {

            return;
        }


        const newPassword =
                prompt(
                        "새 비밀번호를 입력해주세요.\n\n" +
                        "영어 + 숫자 + 특수문자 포함\n" +
                        "8자 이상"
                );


        if (newPassword === null) {

            return;
        }


        const newPasswordConfirm =
                prompt(
                        "새 비밀번호를 다시 입력해주세요."
                );


        if (newPasswordConfirm === null) {

            return;
        }


        try {


            const response =
                    await fetch(
                            "/member/me/password",
                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                            "application/json"
                                },

                                body:
                                        JSON.stringify({

                                            currentPassword:
                                                    currentPassword,

                                            newPassword:
                                                    newPassword,

                                            newPasswordConfirm:
                                                    newPasswordConfirm
                                        })
                            }
                    );


            if (response.ok) {


                const message =
                        await response.text();


                alert(message);


            } else {


                const message =
                        await response.text();


                document
                        .getElementById("result")
                        .textContent =
                        message;

            }


        } catch (error) {


            document
                    .getElementById("result")
                    .textContent =
                    "비밀번호 변경 중 오류가 발생했습니다.";

        }

    }



    // =====================================================
    // 로그아웃
    // =====================================================

    async function logout() {


        try {


            const response =
                    await fetch(
                            "/logout",
                            {

                                method: "POST"

                            }
                    );


            if (response.ok) {


                alert(
                        "로그아웃 되었습니다."
                );


                location.href =
                        "/login.html";

            }


        } catch (error) {


            console.error(error);

        }

    }


</script>


</body>

</html>
